server {
    listen 80;
    server_name _;
    server_tokens off;

    root /var/www/kantin/public;
    index index.php index.html;

    client_max_body_size 50M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Reverb WebSocket proxy
    location /app {
        proxy_pass http://kantin-reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Reverb API (server-side broadcasting)
    location /apps {
        proxy_pass http://kantin-reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Storage link for uploads
    location ^~ /storage/ {
        alias /var/www/kantin/storage/app/public/;
        try_files $uri =404;
        access_log off;
        log_not_found off;
        expires max;
    }

    # Static assets caching
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp|mp3)$ {
        try_files $uri $uri/ /index.php?$query_string;
        access_log off;
        expires max;
        add_header Cache-Control "public, immutable";
    }

    # Laravel Front Controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # FastCGI PHP processing
    location ~ \.php$ {
        fastcgi_pass kantin-app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTPS $http_x_forwarded_proto;
        fastcgi_read_timeout 300;
    }

    # Deny hidden files except .well-known
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
